spring.datasource.url=jdbc:postgresql://localhost:5432/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Hibernate vérifie au démarrage que les entités JPA correspondent au schéma SQL.
# Il ne modifie jamais la base : le schéma est géré par nos scripts SQL.
spring.jpa.hibernate.ddl-auto=validate
spring.mvc.problemdetails.enabled=true

spring.config.import=optional:file:.env[.properties]

# JWT configuration (secret provided through the local .env / environment)
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000
