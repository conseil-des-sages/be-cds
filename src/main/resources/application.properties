spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Flyway crée et fait évoluer le schéma (src/main/resources/db/migration).
# Hibernate vérifie au démarrage que les entités JPA y correspondent, sans jamais le modifier.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

spring.config.import=optional:file:.env[.properties]

# JWT configuration (secret provided through the local .env / environment)
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# Débats : garde-fous pour maîtriser la consommation des API
app.debate.min-sages=2
app.debate.max-sages=8
app.debate.daily-limit=30

# Fournisseurs de modèles : une clé vide désactive le fournisseur
app.llm.timeout-seconds=120
app.llm.default-model=${LLM_DEFAULT_MODEL:mistral-small-latest}

app.llm.providers.mistral.label=Mistral
app.llm.providers.mistral.type=OPENAI_COMPATIBLE
app.llm.providers.mistral.base-url=${MISTRAL_BASE_URL:https://api.mistral.ai/v1}
app.llm.providers.mistral.api-key=${MISTRAL_API_KEY:}

# Gemini et gpt-oss consomment une partie de max_tokens pour leur réflexion interne : on leur en accorde davantage.
app.llm.providers.gemini.label=Gemini
app.llm.providers.gemini.type=OPENAI_COMPATIBLE
app.llm.providers.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
app.llm.providers.gemini.api-key=${GEMINI_API_KEY:}
app.llm.providers.gemini.extra-max-tokens=1024

app.llm.providers.ollama.label=Ollama Cloud
app.llm.providers.ollama.type=OLLAMA
app.llm.providers.ollama.base-url=${OLLAMA_BASE_URL:https://ollama.com}
app.llm.providers.ollama.api-key=${OLLAMA_API_KEY:}
app.llm.providers.ollama.extra-max-tokens=1024

# Catalogue propose dans le formulaire d'un sage. Les identifiants sont ceux de chaque fournisseur.
app.llm.models[0].id=mistral-small-latest
app.llm.models[0].provider=mistral
app.llm.models[0].label=Mistral Small : rapide et francophone
app.llm.models[1].id=mistral-medium-latest
app.llm.models[1].provider=mistral
app.llm.models[1].label=Mistral Medium : \u00e9quilibr\u00e9
app.llm.models[2].id=mistral-large-latest
app.llm.models[2].provider=mistral
app.llm.models[2].label=Mistral Large : le plus nuanc\u00e9
app.llm.models[3].id=gemini-flash-lite-latest
app.llm.models[3].provider=gemini
app.llm.models[3].label=Gemini Flash Lite : le plus rapide
app.llm.models[4].id=gemini-flash-latest
app.llm.models[4].provider=gemini
app.llm.models[4].label=Gemini Flash : tr\u00e8s rapide
app.llm.models[5].id=gpt-oss:20b
app.llm.models[5].provider=ollama
app.llm.models[5].label=gpt-oss 20b (Ollama Cloud)
app.llm.models[6].id=gpt-oss:120b
app.llm.models[6].provider=ollama
app.llm.models[6].label=gpt-oss 120b (Ollama Cloud) : plus puissant
